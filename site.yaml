# Site metadata for the static demo of the chublets.software Wikibase model (schema: PRIMER.md of wikibase-static, A4).
title: chublets.software Wikibase (model demo)
description: The data model of the chublets.software Wikibase, kept as CSV and rendered as a static, read-only copy. Properties, classes and their Wikidata twins; no software entries yet.
# Where docs/ is published; the RDF export needs it for the download URLs of its DCAT distributions.
pages_url: https://n4o-rse.github.io/chublets-wikibase-demo/
# Base of the entity URIs in the RDF export (wd:, wdt:, ...). This demo has its own numbers from 100 on, which the real
# Wikibase (https://chublets-wikibase.de) will not repeat, so it does not borrow that address. A w3id prefix is open
# (PRIMER.md, A6).
rdf_base: https://n4o-rse.github.io/chublets-wikibase-demo
languages:
  default: en
  second: de
# The kernel keeps the formatter URL of external-id properties in P5 (Wikidata uses P1630).
formatter_property: P5
# Logo, top left on every page: the chublets raven. The file is in this repository and is copied to docs/assets/logo/.
logo: assets/logo.png
# Decided 2026-10-21: CC0 for the data (Wikidata is CC0 too). The logo is not covered, see the README. Open: whether the
# CC-BY CodeMeta crosswalk the mapping builds on asks for an attribution (background/sources.csv names it).
license:
  name: CC0 1.0 (Public Domain)
  url: https://creativecommons.org/publicdomain/zero/1.0/
