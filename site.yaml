# Site metadata for the static demo of the chublets.software Wikibase model (schema: PRIMER.md of wikibase-static, A4).
title: chublets.software Wikibase (model demo)
description: The data model of the chublets.software Wikibase, kept as CSV and rendered as a static, read-only copy. Properties, classes and their Wikidata twins, and about 100 software entries imported from open-archaeo.
# Where docs/ is published; the RDF export needs it for the download URLs of its DCAT distributions.
pages_url: https://n4o-rse.github.io/chublets-wikibase-demo/
# Base of the entity URIs in the RDF export. This demo has its own numbers from 100 on, which the real
# Wikibase (https://chublets-wikibase.de) will not repeat, so it does not borrow that address. A w3id prefix is open
# (PRIMER.md, A6).
rdf_base: https://n4o-rse.github.io/chublets-wikibase-demo
# The prefix names of the export: chb:, chbt:, chbp:, ... and not wd:, wdt:, p:, ..., which are those of Wikidata and would make
# chb:Q933 look like an item there (wikibase-static 0.18.0, PRIMER.md A4 "RDF, Präfixe").
rdf_prefix: chb
# The date of the data. The CSV tables carry no modification time of their own, so the header of the Turtle files and the
# catalogue would say "unknown"; this date takes its place (wikibase-static 0.18.3). Set it again when the data change.
data_as_of: 2026-10-25
edit_url: https://github.com/n4o-rse/chublets-wikibase-demo/edit/main/data/csv
# The same entities in the real Wikibase (pushed with wikibase-federation, usecases/chublets; wikibase-static 0.19.0, PRIMER.md A4):
# every page links to its counterpart there, the RDF says owl:sameAs. The table is the idmap that the push wrote
# (data/counterpart/idmap-chublets-wikibase.de.csv); copy it here again after every push.
counterpart:
  name: chublets-wikibase.de
  uri: https://chublets-wikibase.de/entity/{id}
  url: https://chublets-wikibase.de/wiki/Special:EntityPage/{id}
  map: data/counterpart/idmap-chublets-wikibase.de.csv
languages:
  default: en
  second: de
# The kernel keeps the formatter URL of external-id properties in P5 (Wikidata uses P1630).
formatter_property: P5
# Logo, top left on every page: the chublets raven. The file is in this repository and is copied to docs/assets/logo/.
logo: assets/logo.png
# Decided 2026-10-21: CC0 for the data (Wikidata is CC0 too). The logo is not covered, see the README. The CC-BY ConnOSS
# crosswalk the mapping builds on is credited in the README ("Attribution") and in background/sources.csv (S9, with its DOI).
license:
  name: CC0 1.0 (Public Domain)
  url: https://creativecommons.org/publicdomain/zero/1.0/
