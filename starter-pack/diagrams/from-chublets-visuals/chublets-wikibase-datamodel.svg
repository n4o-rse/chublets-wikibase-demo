<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="840" viewBox="0 0 1340 840">
<style>@font-face { font-family: "Fira Sans"; src: url("../../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B5568"/></marker>
</defs>
<rect x="60" y="70" width="560" height="190" rx="10" fill="#E9EFF3" stroke="#2A5F8A" stroke-width="3.5"/><text x="340.0" y="112" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="25" fill="#1E1425">Wikidata software properties</text><text x="340.0" y="152" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="18" fill="#1E1425">WikiProject Informatics/</text><text x="340.0" y="178" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="18" fill="#1E1425">Software/Properties</text><text x="340.0" y="204" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="18" fill="#1E1425">reused via Wikibase federation</text><text x="340.0" y="238" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="22" fill="#2A5F8A">46+ properties, 0 new</text>
<rect x="720" y="70" width="560" height="190" rx="10" fill="#F7F2EA" stroke="#B8862E" stroke-width="3.5"/><text x="1000.0" y="112" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="25" fill="#1E1425">CodeMeta-only fields</text><text x="1000.0" y="152" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="18" fill="#1E1425">CodeMeta terms with no</text><text x="1000.0" y="178" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="18" fill="#1E1425">matching Wikidata property</text><text x="1000.0" y="204" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="18" fill="#1E1425">(see chublets-codemeta-wikidata-crosswalk)</text><text x="1000.0" y="238" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="22" fill="#B8862E">35 new chublets properties</text>
<line x1="340.0" y1="260" x2="660.0" y2="560" stroke="#5B5568" stroke-width="3.5" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="260" x2="680.0" y2="560" stroke="#5B5568" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="60" y="560" width="1220" height="220" rx="12" fill="#E7E4E9" stroke="#3B1F4A" stroke-width="4"/>
<text x="670.0" y="610" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="30" fill="#1E1425">chublets.software Wikibase datamodel</text>
<text x="670.0" y="655" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="19" fill="#1E1425">46+ Wikidata properties, reused as-is</text>
<text x="670.0" y="687" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="19" fill="#1E1425">+ 35 chublets-only properties for the CodeMeta-only fields</text>
<text x="670.0" y="719" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="19" fill="#1E1425">= one federated schema, not a schema invented from scratch</text>
</svg>